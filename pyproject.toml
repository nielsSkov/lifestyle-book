[project]
name = "weight-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "gunicorn",
    "matplotlib",
    "plotly",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipympl",
    "jupytext",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
upgrade = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "BLE", "C", "E", "F", "I", "N", "PT", "UP"]

[tool.ruff.lint.per-file-ignores]
"planning/plan.py" = ["F401"]
"planning/planning_helpers.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    ".uv-cache",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
