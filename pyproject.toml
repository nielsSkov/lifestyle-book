[project]
name = "weight-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "gunicorn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupytext",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
upgrade = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["B", "BLE", "C", "E", "F", "I", "N", "PT", "UP"]
