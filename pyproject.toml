[project]
name = "weight-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "gunicorn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupytext",
    "pytest",
]

[tool.uv]
package = false
upgrade = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
