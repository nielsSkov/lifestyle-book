<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <section class="entry-card">
      <div class="heading">
        <div>
          <p class="eyebrow">Daily record</p>
          <h1>Weight</h1>
        </div>
        {% if latest %}
          <p class="latest"><strong>{{ "%.1f"|format(latest.weight) }}</strong> kg<br><span>{{ latest.date.strftime("%d %b %Y") }}</span></p>
        {% endif %}
      </div>

      {% if saved %}<p class="message success">Saved {{ saved }} kg.</p>{% endif %}
      {% if error %}<p class="message error">{{ error }}</p>{% endif %}

      <form action="{{ url_for('save_weight') }}" method="post">
        <label for="weight">Today's weight</label>
        <div class="input-row">
          <input id="weight" name="weight" type="number" inputmode="decimal" step="0.1" min="30" max="300" required>
          <span>kg</span>
        </div>
        <button type="submit">Save weight</button>
      </form>
    </section>

    <section class="graph-card">
      <div id="weight-plot" role="region" aria-label="Interactive recorded and planned weight chart"></div>
    </section>
    <section class="graph-card">
      <div id="insights-plot" role="region" aria-label="Interactive plan difference and rate of change charts"></div>
    </section>
  </main>
  <script src="{{ url_for('plotly_runtime', v=plotly_version) }}"></script>
  <script>
    const weightFigure = {{ graph_json | safe }};
    const insightsFigure = {{ insights_json | safe }};
    const plotlyConfig = {{ plotly_config | tojson }};
    Promise.all([
      Plotly.newPlot("weight-plot", weightFigure.data, weightFigure.layout, plotlyConfig),
      Plotly.newPlot("insights-plot", insightsFigure.data, insightsFigure.layout, plotlyConfig),
    ]).then(([weightPlot, insightsPlot]) => {
      let syncingXAxes = false;

      function readXRange(update) {
        for (const axis of ["xaxis", "xaxis2", "xaxis3", "xaxis4"]) {
          const range = update[`${axis}.range`];
          if (Array.isArray(range)) return range;

          const start = update[`${axis}.range[0]`];
          const end = update[`${axis}.range[1]`];
          if (start !== undefined && end !== undefined) return [start, end];
        }
        return null;
      }

      function resetsXRange(update) {
        return ["xaxis", "xaxis2", "xaxis3", "xaxis4"].some(
          (axis) => update[`${axis}.autorange`] === true,
        );
      }

      for (const source of [weightPlot, insightsPlot]) {
        source.on("plotly_relayout", (update) => {
          if (syncingXAxes) return;

          const range = readXRange(update);
          if (!range && !resetsXRange(update)) return;

          syncingXAxes = true;
          const target = source === weightPlot ? insightsPlot : weightPlot;
          const linkedUpdate = range
            ? {"xaxis.range": range}
            : {"xaxis.autorange": true};
          Plotly.relayout(target, linkedUpdate).finally(() => {
            syncingXAxes = false;
          });
        });
      }
    });
  </script>
</body>
</html>
