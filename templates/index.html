<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <section class="entry-card">
      <div class="heading">
        <div>
          <p class="eyebrow">Daily record</p>
          <h1>Weight</h1>
        </div>
        {% if latest %}
          <p class="latest"><strong>{{ "%.1f"|format(latest.weight) }}</strong> kg<br><span>{{ latest.date.strftime("%d %b %Y") }}</span></p>
        {% endif %}
      </div>

      <form action="{{ url_for('save_weight') }}" method="post">
        <label for="measurement-date">Measurement Date</label>
        <div class="date-row">
          <button class="date-step" id="previous-date" type="button" aria-label="Previous date">&larr;</button>
          <input id="measurement-date" name="date" type="date" value="{{ selected_date.isoformat() }}" max="{{ today.isoformat() }}" required>
          <button class="date-step" id="next-date" type="button" aria-label="Next date">&rarr;</button>
        </div>
        <label for="weight">Weight</label>
        <div class="input-row">
          <input id="weight" name="weight" type="text" inputmode="decimal">
          <span>kg</span>
        </div>
        <div class="feedback-slot" aria-live="polite">
          {% if saved %}<p class="message success" data-feedback>Saved {{ saved }} kg</p>{% endif %}
          {% if deleted %}<p class="message success" data-feedback>Deleted entry for {{ deleted }}</p>{% endif %}
          {% if error %}<p class="message error" data-feedback>{{ error }}</p>{% endif %}
        </div>
        <button type="submit">Save Weight</button>
      </form>
    </section>

    <section class="graph-card">
      <div id="weight-plot" role="region" aria-label="Interactive recorded and planned weight chart"></div>
    </section>
    <section class="graph-card">
      <div id="difference-plot" role="region" aria-label="Interactive difference from plan chart"></div>
    </section>
    <section class="graph-card">
      <div id="rate-plot" role="region" aria-label="Interactive four-week average weight change chart"></div>
    </section>
  </main>
  <script src="{{ url_for('plotly_runtime', v=plotly_version) }}"></script>
  <script>
    const feedbackMessages = [...document.querySelectorAll("[data-feedback]")];
    if (feedbackMessages.length) {
      const cleanUrl = new URL(window.location.href);
      for (const parameter of ["saved", "deleted", "error"]) {
        cleanUrl.searchParams.delete(parameter);
      }
      window.history.replaceState(
        {},
        "",
        `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`,
      );

      window.setTimeout(() => {
        for (const message of feedbackMessages) message.remove();
      }, 3000);
    }

    const weightEntries = {{ weight_entries | tojson }};
    const today = {{ today.isoformat() | tojson }};
    const dateInput = document.getElementById("measurement-date");
    const weightInput = document.getElementById("weight");
    const nextDateButton = document.getElementById("next-date");

    function selectDate(value) {
      const selected = value > today ? today : value;
      dateInput.value = selected;
      nextDateButton.disabled = selected >= today;
      weightInput.value = Object.prototype.hasOwnProperty.call(weightEntries, selected)
        ? weightEntries[selected].toFixed(1)
        : "";
    }

    function shiftDate(days) {
      const shifted = new Date(`${dateInput.value}T00:00:00Z`);
      shifted.setUTCDate(shifted.getUTCDate() + days);
      selectDate(shifted.toISOString().slice(0, 10));
    }

    document.getElementById("previous-date").addEventListener("click", () => shiftDate(-1));
    nextDateButton.addEventListener("click", () => shiftDate(1));
    dateInput.addEventListener("change", () => selectDate(dateInput.value));
    selectDate(dateInput.value);

    const weightFigure = {{ graph_json | safe }};
    const differenceFigure = {{ difference_json | safe }};
    const rateFigure = {{ rate_json | safe }};
    const plotlyConfig = {{ plotly_config | tojson }};
    Promise.all([
      Plotly.newPlot("weight-plot", weightFigure.data, weightFigure.layout, plotlyConfig),
      Plotly.newPlot("difference-plot", differenceFigure.data, differenceFigure.layout, plotlyConfig),
      Plotly.newPlot("rate-plot", rateFigure.data, rateFigure.layout, plotlyConfig),
    ]).then((linkedPlots) => {
      let syncingXAxes = false;

      function readXRange(update) {
        const range = update["xaxis.range"];
        if (Array.isArray(range)) return range;

        const start = update["xaxis.range[0]"];
        const end = update["xaxis.range[1]"];
        if (start !== undefined && end !== undefined) return [start, end];
        return null;
      }

      function resetsXRange(update) {
        return update["xaxis.autorange"] === true;
      }

      for (const source of linkedPlots) {
        source.on("plotly_relayout", (update) => {
          if (syncingXAxes) return;

          const range = readXRange(update);
          if (!range && !resetsXRange(update)) return;

          syncingXAxes = true;
          const linkedUpdate = range
            ? {"xaxis.range": range}
            : {"xaxis.autorange": true};
          Promise.all(
            linkedPlots
              .filter((target) => target !== source)
              .map((target) => Plotly.relayout(target, linkedUpdate)),
          ).finally(() => {
            syncingXAxes = false;
          });
        });
      }
    });
  </script>
</body>
</html>
