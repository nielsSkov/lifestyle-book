{% extends "base.html" %}
{% block title %}Sleep{% endblock %}
{% block content %}
  <section class="entry-card sleep-entry-card">
    <div class="heading">
      <div>
        <p class="eyebrow">Nightly record</p>
        <h1>Sleep</h1>
      </div>
    </div>

    <form action="{{ url_for('save_sleep') }}" method="post" data-sleep-form>
      <label for="sleep-date">Night</label>
      <div class="date-row" data-date-navigation data-today="{{ latest_night_start.isoformat() }}">
        <button class="date-step" type="button" data-date-step="-1" aria-label="Previous date">&larr;</button>
        <div class="night-date-picker">
          <span data-night-label aria-hidden="true"></span>
          <input id="sleep-date" name="date" type="date" lang="en-GB" value="{{ selected_date.isoformat() }}" max="{{ latest_night_start.isoformat() }}" data-date-input aria-label="Select night" required>
        </div>
        <button class="date-step" type="button" data-date-step="1" aria-label="Next date">&rarr;</button>
      </div>
      <div class="time-grid">
        <div class="time-field">
          <label for="sleep-time">Sleep Time</label>
          <input id="sleep-time" name="sleep_time" type="time" lang="en-GB">
        </div>
        <div class="time-field">
          <label for="wake-time">Wake Time</label>
          <input id="wake-time" name="wake_time" type="time" lang="en-GB">
        </div>
      </div>
      <p class="autosave-status form-save-status" data-sleep-status aria-live="polite">{% if saved %}Saved sleep record{% elif deleted %}Deleted sleep record for {{ deleted }}{% elif error %}{{ error }}{% endif %}</p>
      <button type="submit">Save Sleep</button>
    </form>
  </section>

  <section class="graph-card">
    <div id="sleep-plot" role="region" aria-label="Interactive sleep timing chart"></div>
  </section>
  <section class="graph-card">
    <div id="sleep-duration-plot" role="region" aria-label="Interactive nightly sleep duration chart"></div>
  </section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('plotly_runtime', v=plotly_version) }}"></script>
  <script>
    let sleepEntries = {{ sleep_entries | tojson }};
    const sleepForm = document.querySelector("[data-sleep-form]");
    const sleepTimeInput = document.getElementById("sleep-time");
    const wakeTimeInput = document.getElementById("wake-time");
    const sleepStatus = document.querySelector("[data-sleep-status]");
    let sleepStatusTimer = null;

    function showSleepStatus(message, state = "") {
      window.clearTimeout(sleepStatusTimer);
      sleepStatus.textContent = message;
      sleepStatus.dataset.state = state;
      if (state === "saved") {
        sleepStatusTimer = window.setTimeout(() => {
          sleepStatus.textContent = "";
          sleepStatus.dataset.state = "";
        }, 1800);
      }
    }

    document.querySelector("[data-date-navigation]").addEventListener("datechange", (event) => {
      const entry = sleepEntries[event.detail.date];
      sleepTimeInput.value = entry?.sleep_time ?? "";
      wakeTimeInput.value = entry?.wake_time ?? "";
    });

    let sleepFigure = {{ graph_json | safe }};
    let sleepDurationFigure = {{ duration_graph_json | safe }};
    const plotlyConfig = {{ plotly_config | tojson }};
    const plotsReady = Promise.all([
      PlotlyReadout.newPlot(
        "sleep-plot",
        sleepFigure,
        plotlyConfig,
        {format: "sleep", night: true},
      ),
      PlotlyReadout.newPlot(
        "sleep-duration-plot",
        sleepDurationFigure,
        plotlyConfig,
        {format: "duration", night: true},
      ),
    ]);

    function formatNightTicks(plot) {
      const axis = plot._fullLayout?.xaxis;
      const tickNodes = plot.querySelectorAll(".xaxislayer-above .xtick text");
      if (!axis?.range) return;

      const rangeDates = axis.range.map((value) => new Date(value));
      const visibleDays = Math.abs(
        Date.UTC(
          rangeDates[1].getFullYear(),
          rangeDates[1].getMonth(),
          rangeDates[1].getDate(),
        ) - Date.UTC(
          rangeDates[0].getFullYear(),
          rangeDates[0].getMonth(),
          rangeDates[0].getDate(),
        )
      ) / 86400000;
      tickNodes.forEach((node) => {
        const nativeLabel = node.parentElement.__data__?.text;
        const tickDate = new Date(node.parentElement.__data__?.x);
        if (visibleDays <= 31 && Number.isFinite(tickDate.getTime()) && tickDate.getUTCHours() === 0) {
          const nextDate = new Date(tickDate);
          nextDate.setUTCDate(nextDate.getUTCDate() + 1);
          const month = new Intl.DateTimeFormat("en-GB", {month: "short", timeZone: "UTC"});
          node.textContent = tickDate.getUTCMonth() === nextDate.getUTCMonth()
            ? `${tickDate.getUTCDate()}–${nextDate.getUTCDate()} ${month.format(tickDate)}`
            : `${tickDate.getUTCDate()} ${month.format(tickDate)}–${nextDate.getUTCDate()} ${month.format(nextDate)}`;
          return;
        }
        if (typeof nativeLabel === "string") {
          const oneLineLabel = nativeLabel.replace(/<br\s*\/?>/gi, " ");
          node.textContent = oneLineLabel;
        }
      });
    }

    plotsReady.then((linkedPlots) => {
      const expectedRanges = new WeakMap();
      const fullRange = sleepFigure.layout.xaxis.range;

      function rangeNumber(value) {
        const parsed = new Date(value).getTime();
        return Number.isFinite(parsed) ? parsed : Number(value);
      }

      function rangesMatch(first, second) {
        return Array.isArray(first)
          && Array.isArray(second)
          && Math.abs(rangeNumber(first[0]) - rangeNumber(second[0])) < 1
          && Math.abs(rangeNumber(first[1]) - rangeNumber(second[1])) < 1;
      }

      function readXRange(update) {
        if (Array.isArray(update["xaxis.range"])) return update["xaxis.range"];
        const start = update["xaxis.range[0]"];
        const end = update["xaxis.range[1]"];
        return start !== undefined && end !== undefined ? [start, end] : null;
      }

      for (const source of linkedPlots) {
        formatNightTicks(source);
        source.on("plotly_afterplot", () => formatNightTicks(source));
        source.on("plotly_relayout", (update) => {
          const range = readXRange(update);
          if (!range && update["xaxis.autorange"] !== true) return;
          const expected = expectedRanges.get(source) ?? [];
          const expectedIndex = range
            ? expected.findIndex((candidate) => rangesMatch(range, candidate))
            : -1;
          if (expectedIndex >= 0) {
            expected.splice(expectedIndex, 1);
            return;
          }

          const linkedRange = range ?? fullRange;
          for (const target of linkedPlots) {
            if (target === source && range) continue;
            const queue = expectedRanges.get(target) ?? [];
            queue.push(linkedRange);
            expectedRanges.set(target, queue);
            Plotly.relayout(target, {"xaxis.range": linkedRange});
          }
        });
      }
    });

    sleepForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = sleepForm.querySelector('button[type="submit"]');
      button.disabled = true;
      showSleepStatus("Saving...");
      try {
        const response = await fetch(sleepForm.action, {
          method: "POST",
          headers: {Accept: "application/json"},
          body: new FormData(sleepForm),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? "Could not save sleep record");

        sleepEntries = result.entries;
        sleepFigure = result.figure;
        sleepDurationFigure = result.duration_figure;
        await plotsReady;
        await Promise.all([
          PlotlyReadout.react(
            "sleep-plot",
            sleepFigure,
            plotlyConfig,
            {format: "sleep", night: true},
          ),
          PlotlyReadout.react(
            "sleep-duration-plot",
            sleepDurationFigure,
            plotlyConfig,
            {format: "duration", night: true},
          ),
        ]);
        const entry = sleepEntries[result.selected_date];
        sleepTimeInput.value = entry?.sleep_time ?? "";
        wakeTimeInput.value = entry?.wake_time ?? "";
        showSleepStatus(result.message, "saved");
      } catch (error) {
        showSleepStatus(error.message, "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
{% endblock %}
