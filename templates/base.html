<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Lifestyle Book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='feedback.js') }}" defer></script>
  <script src="{{ url_for('static', filename='date-navigation.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ url_for('weight') }}">
      <span>Lifestyle Book</span>
      <small>{{ record_subtitle }}</small>
    </a>
    <a class="options-link{% if active_section == 'options' %} active{% endif %}" href="{{ url_for('options') }}" aria-label="Options"{% if active_section == 'options' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
      </svg>
    </a>
  </header>
  <div class="navigation-bar">
    <nav class="section-tabs" aria-label="Lifestyle sections">
      <a class="section-tab{% if active_section == 'weight' %} active{% endif %}" href="{{ url_for('weight') }}"{% if active_section == 'weight' %} aria-current="page"{% endif %}>Weight</a>
      <a class="section-tab{% if active_section == 'sleep' %} active{% endif %}" href="{{ url_for('sleep') }}"{% if active_section == 'sleep' %} aria-current="page"{% endif %}>Sleep</a>
      <a class="section-tab{% if active_section == 'daily' %} active{% endif %}" href="{{ url_for('daily') }}"{% if active_section == 'daily' %} aria-current="page"{% endif %}>Daily</a>
    </nav>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
